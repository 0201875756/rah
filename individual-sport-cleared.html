<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0A1020">
<title>ثبت آمار ورزش فردی | ابوفاضل(ع)</title>
<style>
@font-face {
  font-family: vazir;
  src: url(../font/Vazir-Medium.ttf);
}
:root{--bg:#0A1020;--orange:#FF5722;--light:#F4F7FB;--green:#22C55E;--card:#182338;--muted:#9BA8BB;--line:#34445D}
*{box-sizing:border-box}
body{font-family: vazir; margin:0;background:radial-gradient(ellipse at 85% 8%,rgba(255,87,34,.08),transparent 28%),var(--bg);color:#f8fafc;line-height:1.8}
a{text-decoration:none;color:inherit}
button,input,select{font:inherit}
.container{width:min(900px,calc(100% - 32px));margin:auto}
header{border-bottom:1px solid #26334a;background:#0a1020f5}
.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{font-weight:bold;font-size:18px}
.brand span{color:var(--orange)}
.back{border:1px solid var(--line);border-radius:10px;padding:8px 14px;color:#e7edf5}
.back:hover{border-color:var(--orange);color:var(--orange)}
main{padding:42px 0 55px}
.intro{margin-bottom:24px}
h1{font-size:clamp(26px,4vw,38px);line-height:1.5;margin:0 0 7px}
h1 span{color:var(--orange)}
.intro p{color:#bdc9d9;margin:0}
.card{background:linear-gradient(145deg,#1b2940,#121d30);border:1px solid #35465f;border-radius:18px;padding:24px;margin-top:20px;box-shadow:0 12px 28px #0002}
label{display:block;font-weight:bold;margin-bottom:8px}
select{width:100%;background:#081323;color:#fff;border:1px solid #43536b;border-radius:10px;padding:12px;outline:none}
select:focus{border-color:var(--orange)}
.jalaliDate{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px}
.planImage{display:block;width:100%;height:auto;max-height:620px;object-fit:contain;background:#17243a;border:1px solid #34445D;border-radius:12px;margin-top:8px}
.imageCaption{font-size:13px;color:#bdc9d9;margin:8px 0 0}
@media(max-width:420px){.jalaliDate{grid-template-columns:1fr;gap:8px}}
.statusOptions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 18px}
.status{display:flex;align-items:center;gap:10px;padding:16px;border:1px solid #43536b;border-radius:12px;background:#101d30;cursor:pointer;transition:.2s}
.status:has(input:checked){border-color:var(--green);background:#143323}
.status.no:has(input:checked){border-color:var(--orange);background:#382019}
.status input{accent-color:var(--green);width:18px;height:18px}
.status.no input{accent-color:var(--orange)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button{border:0;border-radius:10px;padding:11px 18px;cursor:pointer;font-weight:bold;transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.07)}
.save{background:var(--orange);color:#fff}
.clear{background:transparent;border:1px solid #53647c;color:#e2e8f0}
.message{min-height:26px;color:var(--green);font-size:13px;margin:10px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:#101d30;border:1px solid #2d4058;border-radius:12px;padding:16px;text-align:center}
.stat strong{display:block;font-size:27px;color:var(--green);line-height:1.5}
.stat:nth-child(2) strong{color:var(--orange)}
.stat small{color:#c3cede}
.history{display:grid;gap:9px}
.entry{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#101d30;border:1px solid #2d4058;border-radius:10px;padding:12px 14px}
.entry .date{font-weight:bold}
.pill{border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap}
.yes{background:#16452b;color:#86efac}
.no-pill{background:#48251d;color:#fdbaaa}
.empty{color:#9ba8bb;text-align:center;padding:16px}
footer{border-top:1px solid #26334a;padding:18px 0;color:#9ba8bb;text-align:center;font-size:12px}
@media(max-width:560px){.card{padding:17px}.statusOptions,.stats{grid-template-columns:1fr}.nav{min-height:64px}.brand{font-size:15px}.entry{align-items:flex-start}}
</style>
</head>
<body>
<header><div class="container nav"><a class="brand" href="./index-slider-fixed(1) (1).html">تربیت بدنی <span>ابوفاضل(ع)</span></a><a class="back" href="./index-slider-fixed(1) (1).html">← بازگشت به سایت</a></div></header>
<main class="container">
  <div class="intro">
    <p id="userWelcome" style="color:var(--green);font-weight:bold;margin:0 0 8px" aria-live="polite"></p>
    <h1>آمار روزانهٔ <span>ورزش فردی</span></h1>
    <p>هر روز وضعیت تمرینت را ثبت کن و روند استمرار خودت را ببین.</p>
  </div>

  <section class="card" aria-labelledby="formTitle">
    <h2 id="formTitle" style="margin:0 0 16px;font-size:21px">ثبت وضعیت روز</h2>
    <form id="dailyForm">
      <label>تاریخ را وارد کنید</label>
      <div class="jalaliDate">
        <select id="jalaliDay" aria-label="روز" required></select>
        <select id="jalaliMonth" aria-label="ماه" required></select>
        <select id="jalaliYear" aria-label="سال" required></select>
      </div>
      <label style="margin-top:18px">امروز ورزش فردی انجام دادی؟</label>
      <div class="statusOptions">
        <label class="status"><input type="radio" name="status" value="yes" required><span>بله انجام دادم 💪</span></label>
        <label class="status no"><input type="radio" name="status" value="no" required><span>نه انجام ندادم</span></label>
      </div>
      <img class="planImage" src="../image/-2147483648_-210015.jpg" alt="برنامه ورزش فردی گروه ابوفاضل(ع)" loading="lazy">
      <p class="imageCaption">برنامهٔ ورزش فردی گروه ابوفاضل(ع)</p>
      <div class="actions"><button class="save" type="submit">ذخیرهٔ آمار روز</button><button class="clear" id="resetForm" type="button">پاک کردن فرم</button></div>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section class="card" aria-labelledby="statsTitle">
    <h2 id="statsTitle" style="margin:0 0 16px;font-size:21px">خلاصهٔ عملکرد</h2>
    <div class="stats">
      <div class="stat"><strong id="totalCount">۰</strong><small>روز ثبت‌شده</small></div>
      <div class="stat"><strong id="yesCount">۰</strong><small>روز ورزش‌کرده</small></div>
      <div class="stat"><strong id="rateCount">۰٪</strong><small>درصد استمرار</small></div>
    </div>
  </section>

  <section class="card" aria-labelledby="historyTitle">
    <h2 id="historyTitle" style="margin:0 0 16px;font-size:21px">سوابق روزانه</h2>
    <div class="history" id="history"><p class="empty">هنوز آماری ثبت نشده است.</p></div>
  </section>
</main>
<footer><div class="container">تربیت بدنی گروه ابوفاضل(ع)</div></footer>
<script>
const form = document.getElementById('dailyForm');
const daySelect = document.getElementById('jalaliDay');
const monthSelect = document.getElementById('jalaliMonth');
const yearSelect = document.getElementById('jalaliYear');
const message = document.getElementById('message');
const storageKey = 'abufazl_individual_sport_daily_v1';
const faDigits = value => String(value).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[Number(d)]);
const months = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const today = new Date();
const persianParts = date => {
  const parts = new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(date);
  const get = type => Number(parts.find(p=>p.type===type).value);
  return {year:get('year'),month:get('month'),day:get('day')};
};
const currentJ = persianParts(today);
function fillSelect(select, items, selected){
  select.replaceChildren();
  items.forEach(item=>{const opt=document.createElement('option');opt.value=String(item.value);opt.textContent=item.label;opt.selected=item.value===selected;select.appendChild(opt);});
}
function updateDays(selectedDay){
  const y=Number(yearSelect.value), m=Number(monthSelect.value);
  const max=(m<=6?31:m<=11?30:(isJalaliLeap(y)?30:29));
  const keep=Math.min(Number(selectedDay||daySelect.value||1),max);
  fillSelect(daySelect,Array.from({length:max},(_,i)=>({value:i+1,label:faDigits(i+1)})),keep);
}
function isJalaliLeap(year){
  // Estimate the final day of Esfand using adjacent Persian-calendar new years.
  const start=jalaliToGregorian(year,1,1), next=jalaliToGregorian(year+1,1,1);
  return Math.round((next-start)/86400000)===366;
}
function jalaliToGregorian(jy,jm,jd){
  // Locate the Gregorian date matching the requested Persian date using Intl calendar parts.
  const guess=new Date(Date.UTC(jy+621,2,20));
  let lo=new Date(guess.getTime()-4*86400000), hi=new Date(guess.getTime()+4*86400000);
  while(hi-lo>86400000){
    const mid=new Date(Math.floor((lo.getTime()+hi.getTime())/2/86400000)*86400000);
    const p=persianParts(mid), cmp=p.year-jy || p.month-jm || p.day-jd;
    if(cmp<0) lo=new Date(mid.getTime()+86400000); else hi=mid;
  }
  // Small exact scan around the expected new year avoids timezone assumptions.
  for(let t=guess.getTime()-5*86400000;t<=guess.getTime()+370*86400000;t+=86400000){
    const d=new Date(t), p=persianParts(d);
    if(p.year===jy && p.month===jm && p.day===jd) return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());
  }
  return new Date(hi.getUTCFullYear(),hi.getUTCMonth(),hi.getUTCDate());
}
function toISODate(date){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;}
function fromISODate(value){const [y,m,d]=value.split('-').map(Number);return new Date(y,m-1,d);}
function selectedISO(){return toISODate(jalaliToGregorian(Number(yearSelect.value),Number(monthSelect.value),Number(daySelect.value)));}
function setDateFromISO(value){const p=persianParts(fromISODate(value));yearSelect.value=String(p.year);monthSelect.value=String(p.month);updateDays(p.day);daySelect.value=String(p.day);}
fillSelect(yearSelect,Array.from({length:9},(_,i)=>({value:currentJ.year-4+i,label:faDigits(currentJ.year-4+i)})),currentJ.year);
fillSelect(monthSelect,months.map((label,i)=>({value:i+1,label})),currentJ.month);
updateDays(currentJ.day);
daySelect.value=String(currentJ.day);
function loadRecords(){
  try { const data=JSON.parse(localStorage.getItem(storageKey)||'{}'); return data&&typeof data==='object'?data:{}; }
  catch { return {}; }
}
function displayDate(value){
  const p=persianParts(fromISODate(value));
  return `${faDigits(p.day)} ${months[p.month-1]} ${faDigits(p.year)}`;
}
function render(){
  const records=loadRecords();
  const entries=Object.entries(records).sort((a,b)=>b[0].localeCompare(a[0]));
  const practiced=entries.filter(([,record])=>record.status==='yes').length;
  document.getElementById('totalCount').textContent=faDigits(entries.length);
  document.getElementById('yesCount').textContent=faDigits(practiced);
  document.getElementById('rateCount').textContent=faDigits(entries.length?Math.round(practiced/entries.length*100):0)+'٪';
  const history=document.getElementById('history');history.replaceChildren();
  if(!entries.length){const p=document.createElement('p');p.className='empty';p.textContent='هنوز آماری ثبت نشده است.';history.appendChild(p);return;}
  entries.forEach(([date,record])=>{
    const row=document.createElement('div');row.className='entry';
    const info=document.createElement('div');
    const dateEl=document.createElement('div');dateEl.className='date';dateEl.textContent=displayDate(date);info.appendChild(dateEl);
    const badge=document.createElement('span');badge.className='pill '+(record.status==='yes'?'yes':'no-pill');badge.textContent=record.status==='yes'?'انجام دادم':'انجام ندادم';
    row.append(info,badge);history.appendChild(row);
  });
}
form.addEventListener('submit',event=>{
  event.preventDefault();
  const selected=form.querySelector('input[name="status"]:checked');
  if(!selected){message.textContent='لطفاً وضعیت ورزش را مشخص کن.';return;}
  const date=selectedISO(), records=loadRecords();
  records[date]={status:selected.value};
  try{localStorage.setItem(storageKey,JSON.stringify(records));message.textContent='آمار این روز ذخیره شد.';render();}
  catch{message.textContent='ذخیره‌سازی در این مرورگر در دسترس نیست.';}
});
document.getElementById('resetForm').addEventListener('click',()=>{
  // پاک کردن فرم و تمام آمار ذخیره‌شده، سوابق و خلاصه عملکرد
  try {
    localStorage.removeItem(storageKey);
    form.reset();
    fillSelect(yearSelect,Array.from({length:9},(_,i)=>({value:currentJ.year-4+i,label:faDigits(currentJ.year-4+i)})),currentJ.year);
    fillSelect(monthSelect,months.map((label,i)=>({value:i+1,label})),currentJ.month);
    updateDays(currentJ.day);
    daySelect.value=String(currentJ.day);
    render();
    message.textContent='فرم و تمام آمار ذخیره‌شده پاک شد.';
  } catch {
    message.textContent='پاک کردن اطلاعات در این مرورگر انجام نشد.';
  }
});
monthSelect.addEventListener('change',()=>updateDays());
yearSelect.addEventListener('change',()=>updateDays());
function updateSelectedRecord(){
  const record=loadRecords()[selectedISO()];
  form.querySelectorAll('input[name="status"]').forEach(input=>input.checked=!!record&&input.value===record.status);
  message.textContent=record?'برای این تاریخ قبلاً آمار ثبت شده است.':'';
}
[daySelect,monthSelect,yearSelect].forEach(el=>el.addEventListener('change',updateSelectedRecord));
try{const currentUser=JSON.parse(localStorage.getItem('abufazl_current_user_v1')||'null');const welcome=document.getElementById('userWelcome');if(currentUser&&currentUser.first){welcome.textContent='خوش آمدی '+currentUser.first+(currentUser.last?' '+currentUser.last:'')+' عزیز';}else{welcome.textContent='برای نمایش نامت، ابتدا از صفحهٔ اصلی ثبت‌نام یا وارد حساب شو.';}}catch{}
render();
</script>
</body>
</html>
